name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install consumer browser
        run: pnpm --filter @yunlefun/icons-consumer-tests exec playwright install --with-deps chromium
      - name: Run release preflight
        run: pnpm release:preflight
      - name: Upload consumer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: consumer-acceptance
          path: .artifacts/consumer/results
