name: Publish Package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org/'
          package-manager-cache: false
      - name: Enable pnpm
        run: corepack enable
      - name: Ensure OIDC-compatible npm
        run: npm install --global npm@11.16.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify tag matches package version
        run: node -e "const { version } = require('./packages/icons/package.json'); const expected = 'v' + version; if (process.env.GITHUB_REF_NAME !== expected) { console.error('Expected tag ' + expected + ', received ' + process.env.GITHUB_REF_NAME); process.exit(1) }"
      - name: Run release preflight
        run: pnpm release:preflight
      - name: Publish with npm trusted publishing
        working-directory: packages/icons
        run: |
          RELEASE_DIST_TAG=$(node -p "const version = require('./package.json').version; version.includes('-') ? version.split('-')[1].split('.')[0] : 'latest'")
          npm publish --tag "$RELEASE_DIST_TAG"
