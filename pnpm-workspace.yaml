minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - '@yunlefun/icons@0.3.1'
  - '@yunlefun/ui@0.0.6'

trustPolicy: no-downgrade
shellEmulator: true

packages:
  - docs
  - packages/*
  - tests/consumer

# The shared theme renders the nav logo and favicons from @yunlefun/icons; dogfood this checkout.
overrides:
  '@yunlefun/icons': 'workspace:*'
  # Patched transitive versions for Dependabot alerts (ESLint toolchain only).
  brace-expansion@>=5 <5.0.12: ^5.0.12
  katex: ^0.18.11

allowBuilds:
  esbuild: true

catalog:
  '@antfu/eslint-config': ^9.5.1
  '@fontsource/ibm-plex-mono': ^5.3.0
  '@iconify/tools': ^5.0.14
  '@iconify/types': ^2.0.0
  '@iconify/vue': ^5.0.3
  '@playwright/test': ^1.64.1
  '@types/node': ^26.6.5
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  '@vitejs/plugin-vue': ^6.0.10
  '@vue/test-utils': ^2.5.1
  bumpp: ^12.3.0
  conventional-changelog: 8.1.3
  conventional-changelog-angular: ^9.4.0
  eslint: ^10.13.0
  happy-dom: ^21.0.3
  pngjs: ^7.0.0
  react: ^19.3.1
  react-dom: ^19.3.1
  tsx: ^4.23.15
  typescript: ^6.0.3
  unbuild: ^3.6.1
  unocss: ^66.11.0
  vite: ^8.3.4
  vitepress: 2.0.0-alpha.20
  vitepress-theme-yunlefun: ^0.4.2
  vitest: ^5.0.5
  vue: ^3.5.44
  vue-tsc: ^3.3.13
